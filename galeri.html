<!-- SafeStorage Fallback (Mengatasi Tracking Prevention) -->
<script>
    (function() {
        const memoryStore = {};
        const isStorageAvailable = (type) => {
            try {
                const storage = window[type];
                const x = '__storage_test__';
                storage.setItem(x, x);
                storage.removeItem(x);
                return true;
            } catch (e) {
                return false;
            }
        };
        const getStorage = (type) => {
            if (isStorageAvailable(type)) return window[type];
            return null;
        };
        window.SafeStorage = {
            getItem: (key, type = 'local') => {
                const storage = getStorage(type === 'session' ? 'sessionStorage' : 'localStorage');
                if (storage) return storage.getItem(key);
                return memoryStore[type + '_' + key] || null;
            },
            setItem: (key, value, type = 'local') => {
                const storage = getStorage(type === 'session' ? 'sessionStorage' : 'localStorage');
                if (storage) return storage.setItem(key, value);
                memoryStore[type + '_' + key] = value;
            },
            removeItem: (key, type = 'local') => {
                const storage = getStorage(type === 'session' ? 'sessionStorage' : 'localStorage');
                if (storage) return storage.removeItem(key);
                delete memoryStore[type + '_' + key];
            }
        };
    })();
</script>

<script>
    // ============================================================
    //  STATE
    // ============================================================
    let galleryImages = [];
    let currentImageIndex = 0;

    // ============================================================
    //  SAFE DOM HELPERS
    // ============================================================
    function getEl(id) { return document.getElementById(id); }

    function setHTML(id, html) {
        const el = getEl(id);
        if (el) el.innerHTML = html;
        else console.warn('Elemen tidak ditemukan:', id);
    }

    // ============================================================
    //  NAVBAR USER AREA
    // ============================================================
    function updateNavbarUser() {
        const container = getEl('navbarUserArea');
        if (!container) return;
        const user = Auth.getCurrentUser();
        if (user && user.username) {
            let roleLabel = user.role || 'Petugas';
            let dashboardUrl = 'index.html';
            if (user.role === 'admin') dashboardUrl = 'index.html';
            else if (user.role === 'petugas') dashboardUrl = 'index.html';
            else if (user.role === 'humas') dashboardUrl = 'index.html';
            container.innerHTML = `
                <div class="dropdown">
                    <button class="btn btn-nav-cta dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="fas fa-user-circle me-1"></i>${user.nama} <span class="badge bg-light text-dark ms-1">${roleLabel}</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="${dashboardUrl}"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" onclick="handleLogout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                    </ul>
                </div>`;
        } else {
            container.innerHTML = `<a href="login.html" class="btn btn-nav-cta"><i class="fas fa-user-lock me-2"></i>Area Petugas</a>`;
        }
    }

    function handleLogout() {
        if (confirm('Logout?')) {
            Auth.logout();
            SafeStorage.removeItem('srma19_active_menu', 'local');
            SafeStorage.removeItem('srma19_public_view', 'session');
            window.location.href = 'index.html';
        }
    }

    // ============================================================
    //  LOAD GALERI - ULTRA CEPAT (CACHE DULU)
    // ============================================================
    async function loadGaleri() {
        const grid = getEl('galeriGrid');
        if (!grid) return;

        // 1. RENDER INSTAN DARI CACHE (sessionStorage)
        const cachedData = Common.getSessionCacheData('galeri');
        if (cachedData && cachedData.length > 0) {
            renderGaleriItems(cachedData);
        }

        // 2. FETCH DI BACKGROUND (Update cache & data terbaru)
        try {
            const res = await API.listGaleri('Publish', 0);
            if (res.status === 'success' && res.data.length > 0) {
                // Simpan ke cache agar next load instan
                Common.setSessionCache('galeri', res.data, 10 * 60 * 1000); // 10 menit
                // Render ulang dengan data terbaru
                renderGaleriItems(res.data);
            } else {
                // Jika tidak ada data di server dan cache kosong
                if (!cachedData || cachedData.length === 0) {
                    grid.innerHTML = '<div class="col-12 text-center text-muted py-5">Belum ada galeri dipublikasikan.</div>';
                }
            }
        } catch (e) {
            console.error('Gagal fetch galeri:', e);
            // Jika cache kosong dan fetch gagal
            if (!cachedData || cachedData.length === 0) {
                grid.innerHTML = '<div class="col-12 text-center text-muted py-5">Gagal memuat galeri. Periksa koneksi internet.</div>';
            }
        }
    }

    // Helper untuk merender list galeri
    function renderGaleriItems(data) {
        const grid = getEl('galeriGrid');
        if (!grid) return;
        
        let html = '';
        galleryImages = [];
        
        data.forEach(g => {
            let imgSrc = 'https://placehold.co/600x400/e2e8f0/64748b?text=No+Image';
            if (g.Gambar && (String(g.Gambar).startsWith('data:image') || String(g.Gambar).startsWith('http'))) {
                imgSrc = g.Gambar;
            }
            galleryImages.push(imgSrc);
            html += `
                <div class="col-md-6 col-lg-4">
                    <div class="card-custom berita-card p-0 border-0">
                        <img src="${imgSrc}" alt="${String(g.Judul || 'Galeri')}" onclick="openLightbox(${galleryImages.length - 1})">
                        <div class="card-body p-3">
                            <h6 class="fw-bold mb-0">${String(g.Judul || '-')}</h6>
                            <small class="text-muted">${String(g.Keterangan || '')}</small>
                        </div>
                    </div>
                </div>`;
        });

        grid.innerHTML = html;
    }

    // ============================================================
    //  LIGHTBOX FUNCTIONS
    // ============================================================
    function openLightbox(index) {
        if (galleryImages.length === 0) return;
        currentImageIndex = index;
        updateLightboxImage();
        getEl('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
        getEl('lightbox').style.display = 'none';
    }

    function prevImage() {
        if (galleryImages.length === 0) return;
        currentImageIndex = (currentImageIndex - 1 + galleryImages.length) % galleryImages.length;
        updateLightboxImage();
    }

    function nextImage() {
        if (galleryImages.length === 0) return;
        currentImageIndex = (currentImageIndex + 1) % galleryImages.length;
        updateLightboxImage();
    }

    function updateLightboxImage() {
        const img = getEl('lightboxImg');
        if (img) img.src = galleryImages[currentImageIndex];
    }

    // ============================================================
    //  INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        updateNavbarUser();
        // Pastikan Common sudah dimuat sebelum dipanggil
        if (typeof Common !== 'undefined') {
            loadGaleri();
        } else {
            console.error('Common module belum dimuat!');
            const grid = getEl('galeriGrid');
            if (grid) grid.innerHTML = '<div class="col-12 text-center text-muted py-5">Gagal memuat modul. Refresh halaman.</div>';
        }
        
        const navbar = getEl('navbar');
        window.addEventListener('scroll', () => {
            if (navbar) navbar.classList.toggle('scrolled', window.scrollY > 50);
        });
    });
</script>
