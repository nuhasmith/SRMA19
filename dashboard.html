    <!-- ============================================================
         SAFE STORAGE FALLBACK (Mengatasi Tracking Prevention)
         ============================================================ -->
    <script>
        (function() {
            if (window.SafeStorage) return;
            const memoryStore = {};
            const isStorageAvailable = (type) => {
                try {
                    const storage = window[type];
                    const x = '__storage_test__';
                    storage.setItem(x, x);
                    storage.removeItem(x);
                    return true;
                } catch (e) {
                    return false;
                }
            };
            const getStorage = (type) => {
                if (isStorageAvailable(type)) return window[type];
                return null;
            };
            window.SafeStorage = {
                getItem: (key, type = 'local') => {
                    const storage = getStorage(type === 'session' ? 'sessionStorage' : 'localStorage');
                    if (storage) return storage.getItem(key);
                    return memoryStore[type + '_' + key] || null;
                },
                setItem: (key, value, type = 'local') => {
                    const storage = getStorage(type === 'session' ? 'sessionStorage' : 'localStorage');
                    if (storage) return storage.setItem(key, value);
                    memoryStore[type + '_' + key] = value;
                },
                removeItem: (key, type = 'local') => {
                    const storage = getStorage(type === 'session' ? 'sessionStorage' : 'localStorage');
                    if (storage) return storage.removeItem(key);
                    delete memoryStore[type + '_' + key];
                }
            };
        })();
    </script>

    <!-- ============================================================
         SCRIPT INLINE (CEK LOGIN SETELAH SEMUA MODUL DIMUAT)
         ============================================================ -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Cek apakah Auth sudah tersedia
            if (typeof window.Auth === 'undefined') {
                console.error('Auth module gagal dimuat!');
                window.location.href = 'login.html';
                return;
            }

            // Cek login
            if (!Auth.isLoggedIn()) {
                window.location.replace('login.html');
                return;
            }

            // Bersihkan mode publik & set menu aktif ke dashboard
            SafeStorage.removeItem('srma19_public_view', 'session');
            SafeStorage.setItem('srma19_active_menu', 'dashboard', 'local');

            // Baca parameter ?page= untuk langsung menuju halaman tertentu
            const urlParams = new URLSearchParams(window.location.search);
            const pageParam = urlParams.get('page');
            if (pageParam && ['dashboard', 'peserta', 'absensi', 'izin', 'jadwal', 'petugas', 'wali_asuh', 'alumni', 'laporan', 'berita', 'galeri', 'scanqr', 'statistik', 'pengaturan', 'schedule_override', 'profil'].includes(pageParam)) {
                SafeStorage.setItem('srma19_active_menu', pageParam, 'local');
            }

            // Panggil App.init() untuk merender shell dan halaman awal
            if (window.App && typeof window.App.init === 'function') {
                window.App.init();
            } else {
                console.error('App router tidak ditemukan!');
                document.body.innerHTML = '<div class="alert alert-danger m-3">Terjadi kesalahan: App router tidak dimuat.</div>';
            }
        });
    </script>
