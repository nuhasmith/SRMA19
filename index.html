    <!-- Animasi Elegant Tambahan (Cepat & Smooth) -->
    <style>
        /* ===== ANIMASI ELEGAN ===== */
        body {
            overflow-x: hidden;
        }

        /* Fade In Up untuk seluruh section */
        section, .hero-section, .stat-section, .card-custom {
            animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        /* Variasi delay untuk tampilan berjenjang */
        section:nth-of-type(1) { animation-delay: 0.1s; }
        section:nth-of-type(2) { animation-delay: 0.15s; }
        section:nth-of-type(3) { animation-delay: 0.2s; }
        section:nth-of-type(4) { animation-delay: 0.25s; }
        section:nth-of-type(5) { animation-delay: 0.3s; }

        /* Kartu dengan hover lebih halus */
        .card-custom {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card-custom:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(13, 110, 253, 0.15);
        }

        /* Navbar slide down saat scroll */
        .navbar.scrolled {
            animation: slideDown 0.3s ease;
        }

        /* Tombol dengan efek pulse halus */
        .btn-nav-cta:hover {
            animation: pulse 1.5s infinite;
        }

        /* Hero Title shimmer */
        .hero-section h1 .highlight {
            background-size: 200% auto;
            animation: shimmer 4s linear infinite;
        }

        /* Garis timeline animasi */
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #0d6efd;
            transform: scaleY(0);
            transform-origin: top;
            transition: transform 0.3s ease;
        }

        .timeline-item:hover::before {
            transform: scaleY(1);
        }

        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, rgba(226, 232, 240, 0.5) 25%, rgba(203, 213, 225, 0.5) 50%, rgba(226, 232, 240, 0.5) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }

        /* Lightbox fade in */
        .gallery-lightbox {
            animation: fadeIn 0.3s ease;
        }

        /* Keyframes */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { top: -100px; }
            to { top: 0; }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 107, 53, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0); }
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Scrollbar halus untuk carousel */
        .carousel-track {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        .carousel-track::-webkit-scrollbar {
            height: 6px;
        }

        .carousel-track::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

    <!-- SafeStorage Fallback (Mengatasi Tracking Prevention) -->
    <script>
        (function() {
            if (window.SafeStorage) return;
            const memoryStore = {};
            const isStorageAvailable = (type) => {
                try {
                    const storage = window[type];
                    const x = '__storage_test__';
                    storage.setItem(x, x);
                    storage.removeItem(x);
                    return true;
                } catch (e) {
                    return false;
                }
            };
            const getStorage = (type) => {
                if (isStorageAvailable(type)) return window[type];
                return null;
            };
            window.SafeStorage = {
                getItem: (key, type = 'local') => {
                    const storage = getStorage(type === 'session' ? 'sessionStorage' : 'localStorage');
                    if (storage) return storage.getItem(key);
                    return memoryStore[type + '_' + key] || null;
                },
                setItem: (key, value, type = 'local') => {
                    const storage = getStorage(type === 'session' ? 'sessionStorage' : 'localStorage');
                    if (storage) return storage.setItem(key, value);
                    memoryStore[type + '_' + key] = value;
                },
                removeItem: (key, type = 'local') => {
                    const storage = getStorage(type === 'session' ? 'sessionStorage' : 'localStorage');
                    if (storage) return storage.removeItem(key);
                    delete memoryStore[type + '_' + key];
                }
            };
        })();
    </script>
