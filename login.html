<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Masuk - SRMA 19 Bantul</title>
    <link rel="icon" type="image/webp" href="srma.webp">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0d6efd;
            --primary-dark: #0a58ca;
            --tg-blue: #2e8bc0;
            --tg-blue-dark: #256a94;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(160deg, #0b1e3d 0%, #0d2b5e 25%, #0f3a7a 50%, #0a1e42 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header .brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(46, 139, 192, 0.3);
        }

        .login-header .brand img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .login-header p {
            color: #64748b;
            font-size: 0.9rem;
            margin: 0;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.95rem;
            border: 1px solid #e2e8f0;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: var(--tg-blue);
            box-shadow: 0 0 0 3px rgba(46, 139, 192, 0.15);
        }

        .input-group .form-control {
            border-radius: 0 12px 12px 0 !important;
        }

        .input-group-text {
            border-radius: 12px 0 0 12px !important;
            background: #fff;
            border-right: none;
            padding: 0 14px;
        }

        .input-group-text.toggle-password {
            border-radius: 0 12px 12px 0 !important;
            border-left: none;
            cursor: pointer;
            background: #fff;
            user-select: none;
        }

        .btn-login {
            background: var(--tg-blue);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            box-shadow: 0 6px 20px rgba(46, 139, 192, 0.35);
            transition: background 0.2s, transform 0.1s;
        }

        .btn-login:hover {
            background: var(--tg-blue-dark);
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.65;
            pointer-events: none;
        }

        .form-footer {
            text-align: center;
            margin-top: 24px;
        }

        .form-footer a {
            color: var(--tg-blue);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 12px;
            font-size: 0.85rem;
            padding: 12px 16px;
        }

        .link-lupa-pin {
            font-size: 0.85rem;
            color: var(--tg-blue);
            cursor: pointer;
            text-decoration: underline;
        }

        .link-lupa-pin:hover {
            color: var(--tg-blue-dark);
        }

        .back-home {
            display: inline-block;
            margin-top: 16px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .back-home:hover {
            color: var(--tg-blue);
        }

        .copyright {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            margin-top: 20px;
        }

        /* ===== CAPTCHA STYLE ===== */
        .captcha-question {
            background: #f8f9fa;
            font-weight: 800;
            font-size: 1.2rem;
            text-align: center;
            border-radius: 12px 0 0 12px !important;
            user-select: none;
            letter-spacing: 2px;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .captcha-question::selection {
            background: none;
            color: inherit;
        }
        #captchaInput {
            text-align: center;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Modal */
        .modal-content {
            border-radius: 16px;
            border: none;
        }

        .modal-header {
            border-bottom: 1px solid #e2e8f0;
        }

        .modal-footer {
            border-top: 1px solid #e2e8f0;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px;
            }
            .login-header h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="brand">
                <img src="srma.webp" alt="SRMA 19 Bantul">
            </div>
            <h1>Masuk</h1>
            <p>SRMA 19 Bantul</p>
        </div>

        <form id="loginForm" autocomplete="off">
            <div id="alertContainer"></div>

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Masukkan username" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Masukkan password" maxlength="64" required>
                    <span class="input-group-text toggle-password" id="togglePassword" title="Tampilkan password">
                        <i class="far fa-eye"></i>
                    </span>
                </div>
            </div>

            <!-- CAPTCHA FIELD -->
            <div class="mb-4">
                <label class="form-label"><i class="fas fa-shield-alt me-1"></i> Keamanan Tambahan (Captcha)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-calculator text-muted"></i></span>
                    <span class="form-control captcha-question" id="captchaQuestion">...</span>
                    <button type="button" class="btn btn-outline-secondary" id="btnRefreshCaptcha" onclick="refreshCaptcha()" title="Muat ulang captcha">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <input type="text" class="form-control form-control-sm mt-2" id="captchaInput" placeholder="Masukkan hasil hitungan di atas" maxlength="5" required>
            </div>

            <button type="submit" class="btn btn-login" id="btnLogin">
                <i class="fas fa-sign-in-alt me-2"></i>Masuk
            </button>
        </form>

        <div class="text-center mt-3">
            <span class="link-lupa-pin" onclick="showResetModal()"><i class="fas fa-question-circle me-1"></i>Lupa Password?</span>
        </div>

        <div class="form-footer">
            <a href="index.html"><i class="fas fa-arrow-left me-1"></i>Kembali ke Beranda</a>
        </div>
    </div>
    <p class="copyright">&copy; 2026 SRMA 19 Bantul</p>
</div>

<!-- Modal Reset Password -->
<div class="modal fade" id="resetPasswordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold">Reset Password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted small">Masukkan username Anda. Password akan direset ke <strong>123456</strong>.</p>
                <input type="text" class="form-control" id="resetUsername" placeholder="Username" required>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                <button type="button" class="btn btn-primary" id="resetBtn" onclick="resetPassword()">
                    <i class="fas fa-sync-alt me-1"></i>Reset Password
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>

<script>
    // SafeStorage Fallback (jika belum dimuat oleh auth.js)
    if (typeof window.SafeStorage === 'undefined') {
        window.SafeStorage = (() => {
            const mem = { local: {}, session: {} };
            const isAvailable = (t) => { try { const s = window[t]; s.setItem('__t','1'); s.removeItem('__t'); return true; } catch(e){ return false; } };
            return {
                getItem: (k, t='local') => { if (isAvailable(t === 'session' ? 'sessionStorage' : 'localStorage')) return window[t === 'session' ? 'sessionStorage' : 'localStorage'].getItem(k); return mem[t][k] || null; },
                setItem: (k, v, t='local') => { if (isAvailable(t === 'session' ? 'sessionStorage' : 'localStorage')) return window[t === 'session' ? 'sessionStorage' : 'localStorage'].setItem(k, v); mem[t][k] = v; },
                removeItem: (k, t='local') => { if (isAvailable(t === 'session' ? 'sessionStorage' : 'localStorage')) return window[t === 'session' ? 'sessionStorage' : 'localStorage'].removeItem(k); delete mem[t][k]; }
            };
        })();
    }

    // ============================================================
    //  REDIRECT JIKA SUDAH LOGIN (JANGAN PAKSA DASHBOARD)
    // ============================================================
    if (Auth.isLoggedIn()) {
        // Jika sudah login, arahkan ke halaman publik (biarkan app.js memutuskan)
        window.location.replace('index.html');
    }

    // ============================================================
    //  DOM REFS
    // ============================================================
    const loginForm = document.getElementById('loginForm');
    const alertContainer = document.getElementById('alertContainer');
    const btnLogin = document.getElementById('btnLogin');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const captchaInput = document.getElementById('captchaInput');

    // ============================================================
    //  CAPTCHA LOGIC
    // ============================================================
    let captchaAnswer = 0;

    function generateCaptcha() {
        const num1 = Math.floor(Math.random() * 20) + 1;
        const num2 = Math.floor(Math.random() * 10) + 1;
        const ops = ['+', '-', '*'];
        const op = ops[Math.floor(Math.random() * ops.length)];
        let answer = 0;
        if (op === '+') answer = num1 + num2;
        else if (op === '-') answer = num1 - num2;
        else answer = num1 * num2;
        captchaAnswer = answer;
        document.getElementById('captchaQuestion').textContent = `${num1} ${op} ${num2} = ?`;
        captchaInput.value = '';
        captchaInput.classList.remove('is-invalid');
    }

    function refreshCaptcha() {
        generateCaptcha();
    }

    function validateCaptcha() {
        const userAnswer = parseInt(captchaInput.value, 10);
        if (isNaN(userAnswer) || userAnswer !== captchaAnswer) {
            captchaInput.value = '';
            captchaInput.classList.add('is-invalid');
            captchaInput.focus();
            refreshCaptcha();
            return false;
        }
        captchaInput.classList.remove('is-invalid');
        return true;
    }

    // Generate captcha saat load
    window.addEventListener('load', () => {
        generateCaptcha();
        usernameInput.focus();
    });

    // ============================================================
    //  TOGGLE PASSWORD VISIBILITY
    // ============================================================
    togglePassword.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        togglePassword.innerHTML = isPassword ? '<i class="far fa-eye-slash"></i>' : '<i class="far fa-eye"></i>';
        togglePassword.title = isPassword ? 'Sembunyikan password' : 'Tampilkan password';
        passwordInput.focus();
    });

    // ============================================================
    //  SHOW ALERT
    // ============================================================
    function showAlert(message, type = 'danger') {
        alertContainer.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">${message}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>`;
    }

    // ============================================================
    //  LOGIN SUBMIT (Dengan Validasi Captcha)
    // ============================================================
    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        alertContainer.innerHTML = '';

        // Validasi Captcha
        if (!validateCaptcha()) {
            showAlert('❌ Jawaban Captcha salah. Silakan hitung ulang.', 'warning');
            return;
        }

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        if (!username) {
            showAlert('Username wajib diisi.', 'warning');
            usernameInput.focus();
            return;
        }

        if (!password) {
            showAlert('Password wajib diisi.', 'warning');
            passwordInput.focus();
            return;
        }

        if (password.length < 4) {
            showAlert('Password minimal 4 karakter.', 'warning');
            passwordInput.focus();
            return;
        }

        btnLogin.disabled = true;
        btnLogin.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memeriksa...';

        try {
            const result = await Auth.login(username, password);
            if (result.success) {
                showAlert('✅ Login berhasil! Mengalihkan...', 'success');
                
                // PENTING: Bersihkan mode publik & set menu aktif ke dashboard
                if (typeof SafeStorage !== 'undefined') {
                    SafeStorage.removeItem('srma19_public_view', 'session');
                    SafeStorage.setItem('srma19_active_menu', 'dashboard', 'local');
                } else {
                    sessionStorage.removeItem('srma19_public_view');
                    localStorage.setItem('srma19_active_menu', 'dashboard');
                }

                setTimeout(() => {
                    // ARAHKAN KE DASHBOARD DENGAN PARAMETER ?dashboard=1
                    window.location.href = 'index.html?dashboard=1';
                }, 500);
            } else {
                showAlert('❌ ' + (result.message || 'Username atau password salah.'), 'danger');
                btnLogin.disabled = false;
                btnLogin.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Masuk';
                passwordInput.value = '';
                passwordInput.focus();
                refreshCaptcha(); // Refresh captcha jika login gagal
            }
        } catch (error) {
            showAlert('⚠️ Gagal terhubung ke server. Periksa koneksi internet.', 'danger');
            btnLogin.disabled = false;
            btnLogin.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Masuk';
            refreshCaptcha();
        }
    });

    // ============================================================
    //  RESET PASSWORD MODAL
    // ============================================================
    function showResetModal() {
        const modal = new bootstrap.Modal(document.getElementById('resetPasswordModal'));
        modal.show();
    }

    async function resetPassword() {
        const username = document.getElementById('resetUsername').value.trim();
        if (!username) {
            alert('Username wajib diisi!');
            return;
        }

        const resetBtn = document.getElementById('resetBtn');
        resetBtn.disabled = true;
        resetBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Memproses...';

        try {
            const res = await API.resetPin(username);
            if (res.status === 'ok') {
                alert('✅ ' + res.message);
                bootstrap.Modal.getInstance(document.getElementById('resetPasswordModal')).hide();
                document.getElementById('resetUsername').value = '';
            } else {
                alert('❌ ' + res.message);
            }
        } catch (e) {
            alert('⚠️ Gagal terhubung ke server.');
        }

        resetBtn.disabled = false;
        resetBtn.innerHTML = '<i class="fas fa-sync-alt me-1"></i>Reset Password';
    }
</script>

</body>
</html>
